name: Phase 2 data health

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/data-health.mjs"
      - ".github/workflows/data-health.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Monitor official free sources
        run: node scripts/check-official-sources.mjs
      - name: Generate data health
        run: node scripts/data-health.mjs
      - name: Run QA
        run: npm run qa
      - name: Persist monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data-health.json data/official-source-state.json data/official-source-changes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update phase 2 data health"
          git pull --rebase origin main
          git push
      - name: Flag changed official sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(node -e 'console.log(require("./data/official-source-changes.json").changes.length)')
          if [ "$count" = "0" ]; then exit 0; fi
          names=$(node -e 'console.log(require("./data/official-source-changes.json").changes.map(x=>x.id).join(", "))')
          body="Automatisk bevakning har upptäckt ändrat innehåll. Ingen sakuppgift ändras automatiskt; källan ska verifieras innan data uppdateras."
          existing=$(gh issue list --state open --search '"Officiell datakälla ändrad" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Officiell datakälla ändrad: $names" --body "$body"; fi
