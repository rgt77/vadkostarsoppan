name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run QA
        run: npm run qa 2>&1 | tee qa-output.txt
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: qa-output.txt
          retention-days: 3
