name: Monitor political sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: policy-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official party sources
        run: node scripts/check-policy-sources.mjs
      - name: Run QA
        run: npm run qa
      - name: Commit source fingerprints
        run: |
          if git diff --quiet -- data/policy-source-state.json data/policy-source-changes.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policy-source-state.json data/policy-source-changes.json
          git commit -m "chore: monitor political sources"
          git pull --rebase origin main
          git push
      - name: Open review issue when sources changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const x=require("./data/policy-source-changes.json"); if(x.changes.length) process.exit(0); process.exit(78)' || status=$?
          if [ "${status:-0}" = "78" ]; then exit 0; fi
          names=$(node -e 'const x=require("./data/policy-source-changes.json"); console.log(x.changes.map(c=>c.name).join(", "))')
          body=$(node -e 'const x=require("./data/policy-source-changes.json"); console.log("Automatisk bevakning har upptäckt ändrat innehåll i officiell källa för: "+x.changes.map(c=>c.name).join(", ")+".\n\nIngen publik politisk siffra har ändrats automatiskt. Granska källan och uppdatera policy-data.js endast efter manuell faktakontroll.")')
          existing=$(gh issue list --state open --search '"Politisk källa ändrad" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Politisk källa ändrad: $names" --body "$body"; fi
