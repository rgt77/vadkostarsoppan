name: Update fuel prices

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh price data
        run: node scripts/update-price-data.mjs

      - name: Run QA
        run: npm run qa

      - name: Commit updated prices
        shell: bash
        run: |
          if git diff --quiet -- county-data.js; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "vadkostarsoppan-data"
          git config user.email "actions@users.noreply.github.com"
          git add county-data.js
          git commit -m "Data: refresh fuel prices"
          git push
