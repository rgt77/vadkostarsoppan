name: Update fuel prices

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-price-data.mjs"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: fuel-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh price data
        run: node scripts/update-price-data.mjs

      - name: Run QA
        run: npm run qa

      - name: Commit updated prices
        shell: bash
        run: |
          if git diff --quiet -- price-data.js data/price-history.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "vadkostarsoppan-data"
          git config user.email "actions@users.noreply.github.com"
          git add price-data.js data/price-history.json
          git commit -m "Data: refresh fuel prices"
          git pull --rebase origin main
          git push

      - name: Flag price update failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Den automatiska uppdateringen av nationella drivmedelspriser misslyckades. Kontrollera workflow-loggen innan prisdata betraktas som aktuell."
          existing=$(gh issue list --state open --search '"Prisuppdatering misslyckades" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Prisuppdatering misslyckades" --body "$body"; fi
