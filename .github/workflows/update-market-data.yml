name: Update market data

on:
  schedule:
    - cron: "35 15 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-market-data.mjs"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh official market inputs
        run: node scripts/update-market-data.mjs
      - name: Run QA
        run: npm run qa
      - name: Validate generated market data
        run: node -e 'const d=require("./data/market-data.json"); if(!(d.fx.usdSek>5&&d.fx.usdSek<20)) process.exit(1)'
      - name: Refresh data health
        run: node scripts/data-health.mjs
      - name: Commit market data
        run: |
          if git diff --quiet -- data/market-data.json data/market-history.json data/data-health.json; then exit 0; fi
          git config user.name "vadkostarsoppan-data"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-data.json data/market-history.json data/data-health.json
          git commit -m "Data: refresh market inputs"
          git pull --rebase origin main
          git push

      - name: Flag stale market data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(node -e 'const d=require("./data/data-health.json"); const x=d.checks.find(x=>x.id==="market:usdsek"); console.log(x?.status||"warning")')
          if [ "$status" = "ok" ]; then exit 0; fi
          body="Automatisk driftkontroll visar att USD/SEK-marknadsdata behöver granskas. Kontrollera senaste Riksbankshämtningen och workflow-loggen."
          existing=$(gh issue list --state open --search '"Marknadsdata behöver granskas" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Marknadsdata behöver granskas" --body "$body"; fi
