name: Update market data

on:
  schedule:
    - cron: "35 15 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-market-data.mjs"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh official market inputs
        run: node scripts/update-market-data.mjs
      - name: Run QA
        run: npm run qa
      - name: Validate generated market data
        run: node -e 'const d=require("./data/market-data.json"); if(!(d.fx.usdSek>5&&d.fx.usdSek<20)) process.exit(1)'
      - name: Commit market data
        run: |
          if git diff --quiet -- data/market-data.json data/market-history.json; then exit 0; fi
          git config user.name "vadkostarsoppan-data"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-data.json data/market-history.json
          git commit -m "Data: refresh market inputs"
          git push
