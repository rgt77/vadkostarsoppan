name: Performance audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "fuel-data.js"
      - "price-data.js"
      - "policy-data.js"
      - "scripts/performance-budget.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run audit:performance
